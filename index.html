<!DOCTYPE html>
<html>
<head>
    <title>NDR - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <a href="index.html">
                <img src="logo.png" alt="Logo Andriyano">
            </a>
        </div>
        <div class="menu">
            <a href="index.html">Home</a>
            <a href="blog.html">Blog</a>
            <a href="about.html">About</a>
            <a href="learn.html">Learn</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <section class="hero">
        <div class="kiri">
            <h1>Belajar Web Development</h1>
            <p>Dari nol jadi bisa bikin website keren!</p>
            <a href="learn.html" class="tombol-link">Mulai Belajar</a>
        </div>
        <div class="kanan">
            <div class="hero-image">
                <!-- Ilustrasi Developer SVG -->
                <svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
                    <!-- Background circles -->
                    <circle cx="250" cy="200" r="120" fill="#8b5cf6" opacity="0.1"/>
                    <circle cx="250" cy="200" r="80" fill="#8b5cf6" opacity="0.15"/>
                    
                    <!-- Desk -->
                    <rect x="50" y="280" width="400" height="20" rx="5" fill="#1e1e2e"/>
                    
                    <!-- Monitor -->
                    <rect x="120" y="100" width="260" height="170" rx="15" fill="#1e1e2e"/>
                    <rect x="130" y="110" width="240" height="140" rx="8" fill="#0d1117"/>
                    <rect x="230" y="260" width="40" height="25" fill="#1e1e2e"/>
                    
                    <!-- Screen content - Code -->
                    <rect x="145" y="125" width="100" height="8" rx="2" fill="#e94560"/>
                    <rect x="145" y="140" width="150" height="8" rx="2" fill="#10b981"/>
                    <rect x="145" y="155" width="80" height="8" rx="2" fill="#8b5cf6"/>
                    <rect x="145" y="170" width="130" height="8" rx="2" fill="#00d9ff"/>
                    <rect x="145" y="185" width="90" height="8" rx="2" fill="#f59e0b"/>
                    <rect x="145" y="200" width="120" height="8" rx="2" fill="#e94560"/>
                    <rect x="145" y="215" width="70" height="8" rx="2" fill="#10b981"/>
                    <rect x="145" y="230" width="140" height="8" rx="2" fill="#8b5cf6"/>
                    
                    <!-- Floating icons -->
                    <!-- HTML icon -->
                    <g transform="translate(60, 120)">
                        <rect width="50" height="50" rx="10" fill="#e44d26" opacity="0.9">
                            <animate attributeName="y" values="0;-10;0" dur="3s" repeatCount="indefinite"/>
                        </rect>
                        <text x="25" y="33" text-anchor="middle" fill="white" font-size="18" font-weight="bold">H</text>
                    </g>
                    
                    <!-- CSS icon -->
                    <g transform="translate(390, 100)">
                        <rect width="50" height="50" rx="10" fill="#264de4" opacity="0.9">
                            <animate attributeName="y" values="0;10;0" dur="2.5s" repeatCount="indefinite"/>
                        </rect>
                        <text x="25" y="33" text-anchor="middle" fill="white" font-size="18" font-weight="bold">C</text>
                    </g>
                    
                    <!-- JS icon -->
                    <g transform="translate(420, 180)">
                        <rect width="50" height="50" rx="10" fill="#f7df1e" opacity="0.9">
                            <animate attributeName="y" values="0;-8;0" dur="3.5s" repeatCount="indefinite"/>
                        </rect>
                        <text x="25" y="33" text-anchor="middle" fill="#1e1e2e" font-size="18" font-weight="bold">JS</text>
                    </g>
                    
                    <!-- Coffee cup -->
                    <g transform="translate(50, 200)">
                        <ellipse cx="30" cy="80" rx="25" ry="8" fill="#1e1e2e" opacity="0.3"/>
                        <path d="M10 20 L10 70 Q10 85 30 85 Q50 85 50 70 L50 20 Z" fill="#8b5cf6"/>
                        <ellipse cx="30" cy="20" rx="20" ry="6" fill="#a78bfa"/>
                        <ellipse cx="30" cy="25" rx="16" ry="4" fill="#4a3728"/>
                        <path d="M52 30 Q70 30 70 50 Q70 70 52 70" stroke="#8b5cf6" stroke-width="5" fill="none" stroke-linecap="round"/>
                        <!-- Steam -->
                        <path d="M20 10 Q15 -5 25 -15" stroke="white" stroke-width="2" fill="none" opacity="0.6">
                            <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
                        </path>
                        <path d="M35 8 Q40 -8 30 -18" stroke="white" stroke-width="2" fill="none" opacity="0.6">
                            <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2.5s" repeatCount="indefinite"/>
                        </path>
                    </g>
                    
                    <!-- Decorative dots -->
                    <circle cx="85" cy="320" r="4" fill="#8b5cf6" opacity="0.5">
                        <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="100" cy="310" r="3" fill="#e94560" opacity="0.5">
                        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2.5s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="400" cy="315" r="4" fill="#10b981" opacity="0.5">
                        <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="420" cy="305" r="3" fill="#00d9ff" opacity="0.5">
                        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3.5s" repeatCount="indefinite"/>
                    </circle>
                </svg>
            </div>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2026 <img src="logo.png" alt="Logo" style="height: 20px; vertical-align: middle;"> All rights reserved.</p>
        <div class="social">
            <a href="#">Instagram</a>
            <a href="#">Twitter</a>
            <a href="#">GitHub</a>
        </div>
    </footer>
</body>
</html>
